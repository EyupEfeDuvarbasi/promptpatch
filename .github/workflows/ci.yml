name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Prompt corpus
        run: go run ./tools/prompttest

      - name: Vet
        run: go vet ./...

      - name: Web smoke test
        shell: bash
        run: |
          suffix="${{ runner.os == 'Windows' && '.exe' || '' }}"
          go build -o "promptcheck$suffix" ./cmd/promptcheck
          ./promptcheck$suffix version
          PROMPTPATCH_SERVER_ADDR=127.0.0.1:18787 ./promptcheck$suffix serve >server.log 2>&1 & pid=$!
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:18787/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:18787/healthz
          kill $pid

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build promptcheck
        run: go build ./cmd/promptcheck
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
