name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: tar.gz}
          - {goos: linux, goarch: arm64, ext: tar.gz}
          - {goos: darwin, goarch: amd64, ext: tar.gz}
          - {goos: darwin, goarch: arm64, ext: tar.gz}
          - {goos: windows, goarch: amd64, ext: zip}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        shell: bash
        run: |
          name="promptcheck_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p dist/$name
          suffix=""
          if [ "${{ matrix.goos }}" = windows ]; then suffix=.exe; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/$name/prompter$suffix ./cmd/promptcheck
          cp README.md dist/$name/
          if [ "${{ matrix.ext }}" = zip ]; then (cd dist && zip -r $name.zip $name); else tar -C dist -czf dist/$name.tar.gz $name; fi
          sha256sum dist/*.${{ matrix.ext }} > dist/$name.${{ matrix.ext }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
